<!doctype html>
<html lang="uk">

<head>
  <meta charset="utf-8" />
  <title>Silk4me</title>
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      var base = "/silk4me/";
      var path = window.location.pathname;

      // Если запрос НЕ в пределах /silk4me/ — ничего не делаем
      if (!path.startsWith(base)) return;

      // Если это файл (есть расширение) — не редиректим
      // Сработает для: .xml .txt .ico .png .webmanifest .css .js .map и т.д.
      var last = path.split("/").pop() || "";
      if (last.includes(".") && !last.endsWith(".")) return;

      // SPA: редиректим на корень приложения
      if (path !== base) window.location.replace(base);
    })();
  </script>
</head>

<body></body>

</html>
