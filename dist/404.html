<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Silk4me — Re:Silk | Duty to Beauty</title>
  <meta name="robots" content="noindex" />

  <script>
    (function () {
      var base = "/duty-to-beauty/";
      var path = window.location.pathname;

      // If request is NOT inside /duty-to-beauty/ — do nothing
      if (!path.startsWith(base)) return;

      // If it's a file (has extension) — do not redirect
      // Works for: .xml .txt .ico .png .webmanifest .css .js .map etc.
      var last = path.split("/").pop() || "";
      if (last.includes(".") && !last.endsWith(".")) return;

      // SPA fallback: redirect to app root
      if (path !== base) window.location.replace(base);
    })();
  </script>
</head>

<body></body>

</html>
